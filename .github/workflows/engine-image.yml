name: engine-image

# Builds the public developer image of the engine, ghcr.io/orcher-io/orcher,
# for linux/amd64 and linux/arm64, smoke-tests it, and publishes it.
#
#   - On a release: release-please.yml calls this with the tag it just cut,
#     once the repository variable PUBLISH_ENGINE_IMAGE is "true". A tag that
#     release-please pushes with the default token starts no workflow of its
#     own, so a `push: tags` trigger here would never fire; the call is how a
#     release reaches this workflow.
#   - By hand: `gh workflow run engine-image.yml -f tag=v0.5.0` publishes an
#     existing tag, whatever the variable says.
#   - On a pull request that touches the image: the image for the runner's
#     own platform, compiled, packaged and smoke-tested, so a broken image is
#     found before a release rather than by it. The other platform and the
#     push are a release's alone.
#
# A tag vX.Y.Z is published as X.Y.Z, X.Y and latest. Both architectures are
# compiled on the runner itself and cross-linked with zig
# (docker/engine/build-binaries.sh), so neither is a Rust build under
# emulation or inside a Docker VM; the Dockerfile only packages them.
#
# Pushes with this workflow's GITHUB_TOKEN; no personal token is involved. A
# package's first push creates it PRIVATE: making it public is a one-time
# change in the package's settings.
#
# The image carries /THIRD_PARTY_NOTICES, generated by build-binaries.sh from
# Cargo.lock with cargo-about (installed on first use), which fails the build
# when a dependency's license is not on docker/engine/about.toml's allow-list.
#
# It runs on GitHub's hosted runners only, as ci.yml does.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v0.5.0). Must already exist.'
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v0.5.0).'
        required: true
        type: string
  pull_request:
    paths:
      - 'docker/engine/**'
      - 'LICENSE'
      - 'Cargo.lock'
      - '.github/workflows/engine-image.yml'

permissions:
  contents: read

concurrency:
  group: engine-image-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/orcher-io/orcher
  DOCKERFILE: docker/engine/Dockerfile
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      attestations: read # the dashboard release's provenance
    steps:
      - name: Resolve what to build
        id: meta
        env:
          TAG: ${{ inputs.tag }}
          RUN_ID: ${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -n "$TAG" ]; then
            if ! [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "::error::'$TAG' is not a release tag of the form vX.Y.Z."
              exit 1
            fi
            version="${TAG#v}"
            minor="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
            {
              echo "push=true"
              echo "ref=refs/tags/$TAG"
              echo "version=$version"
              echo "tags=$IMAGE:$version,$IMAGE:$minor,$IMAGE:latest"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "push=false"
              echo "ref="
              echo "version=0.0.0-pr.${PR_NUMBER:-0}"
              echo "tags="
            } >> "$GITHUB_OUTPUT"
          fi
          {
            echo "local=orcher-engine-ci:$RUN_ID"
            echo "smoke=orcher-smoke-$RUN_ID"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.meta.outputs.ref }}

      # The tag names the image; the workspace version is what the binary
      # reports. A tag on a commit whose version was never bumped would publish
      # an image whose label and binary disagree.
      - name: Check the tag matches the workspace version
        if: steps.meta.outputs.push == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          workspace=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)
          if [ "$workspace" != "$VERSION" ]; then
            echo "::error::Tag says $VERSION but Cargo.toml's workspace version is '$workspace'."
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Both platforms for an image that is pushed. A pull request's check
      # packages and smoke-tests only the runner's own, so it compiles only
      # that one: the other is a second release build of the whole engine,
      # about half the job, for an image nothing runs.
      - name: Choose the platforms to compile
        env:
          PUSH: ${{ steps.meta.outputs.push }}
        run: |
          if [ "$PUSH" = "true" ]; then
            echo "ENGINE_IMAGE_ARCHES=amd64 arm64" >> "$GITHUB_ENV"
          else
            case "$(uname -m)" in
              aarch64|arm64) echo "ENGINE_IMAGE_ARCHES=arm64" >> "$GITHUB_ENV" ;;
              *)             echo "ENGINE_IMAGE_ARCHES=amd64" >> "$GITHUB_ENV" ;;
            esac
          fi

      - name: Compile for ${{ env.ENGINE_IMAGE_ARCHES }}
        run: docker/engine/build-binaries.sh

      - name: Check each compiled architecture's binaries
        run: |
          set -euo pipefail
          for pair in amd64:x86-64 arm64:aarch64; do
            arch="${pair%%:*}"; want="${pair#*:}"
            case " $ENGINE_IMAGE_ARCHES " in *" $arch "*) ;; *) continue ;; esac
            for bin in orchestrator orcher-migrate; do
              desc=$(file -b "target/engine-image/$arch/$bin")
              echo "$arch/$bin: $desc"
              case "$desc" in
                *ELF\ 64-bit*"$want"*) ;;
                *) echo "::error::$arch/$bin is not a $want ELF binary"; exit 1 ;;
              esac
            done
          done

      # build-binaries.sh checked the dashboard's archive against ui.lock's
      # SHA-256; this checks that orcher-io/ui's own release workflow built it.
      - name: Check the dashboard's build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify target/engine-image/orcher-ui-*.tar.gz --repo orcher-io/ui

      # A hosted runner's Docker cannot hold a multi-platform image; a builder
      # in a container can.
      - name: Set up buildx
        uses: docker/setup-buildx-action@v4

      - name: Show the builder
        run: |
          docker version --format 'docker client {{.Client.Version}}, server {{.Server.Version}} ({{.Server.Arch}})'
          docker buildx version
          docker buildx inspect | sed -n '1,12p'
          case "$(docker version --format '{{.Server.Arch}}')" in
            arm64|aarch64) echo "NATIVE_PLATFORM=linux/arm64" >> "$GITHUB_ENV" ;;
            *)             echo "NATIVE_PLATFORM=linux/amd64" >> "$GITHUB_ENV" ;;
          esac

      - name: Package the image for the runner's architecture
        env:
          LOCAL: ${{ steps.meta.outputs.local }}
          VERSION: ${{ steps.meta.outputs.version }}
          CREATED: ${{ steps.meta.outputs.created }}
        run: |
          set -euo pipefail
          docker buildx build -f "$DOCKERFILE" \
            --platform "$NATIVE_PLATFORM" \
            --build-arg VERSION="$VERSION" \
            --build-arg REVISION="$(git rev-parse HEAD)" \
            --build-arg CREATED="$CREATED" \
            --tag "$LOCAL" --load .

      # The image a developer would run, as they would run it: a Postgres
      # beside it on a network, nothing but DATABASE_URL set. It must migrate,
      # open its gRPC port and answer ready, or the job fails.
      - name: Smoke test
        env:
          LOCAL: ${{ steps.meta.outputs.local }}
          NAME: ${{ steps.meta.outputs.smoke }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          docker network create "$NAME"
          docker run -d --name "$NAME-pg" --network "$NAME" \
            -e POSTGRES_USER=orcher -e POSTGRES_PASSWORD=orcher -e POSTGRES_DB=orcher \
            postgres:17-alpine
          # The engine refuses to serve without authentication off loopback,
          # and in a container it listens on every interface, so it is started
          # the way docker/engine/README.md tells a user to start it.
          docker run -d --name "$NAME-engine" --network "$NAME" \
            -e DATABASE_URL="postgresql://orcher:orcher@$NAME-pg:5432/orcher" \
            -e ORCHER_INSECURE=true \
            "$LOCAL"

          fail() {
            echo "::error::$*"
            docker logs "$NAME-engine" 2>&1 | tail -60 || true
            exit 1
          }

          ready=false
          for _ in $(seq 1 90); do
            running=$(docker inspect -f '{{.State.Running}}' "$NAME-engine")
            [ "$running" = "true" ] || fail "the engine exited during startup"
            if docker exec "$NAME-engine" bash -c 'exec 3<>/dev/tcp/127.0.0.1/50051' 2>/dev/null \
              && docker exec "$NAME-engine" orcher-entrypoint healthcheck; then
              ready=true
              break
            fi
            sleep 2
          done
          [ "$ready" = "true" ] || fail "the engine never opened :50051 and answered /health/ready"
          echo "gRPC port open, /health/ready answered 200"

          # From outside the engine's container, as a client would.
          health=$(docker run --rm --network "$NAME" curlimages/curl:8.10.1 \
            -fsS -m 5 "http://$NAME-engine:8080/health")
          echo "/health: $health"
          case "$health" in
            *'"status":"healthy"'*) ;;
            *) fail "/health does not report healthy" ;;
          esac

          # The dashboard, after the engine's own routes: its page at / and at
          # any deep link, the API still the API, and a wrong API path still a
          # 404 rather than the page.
          get() {
            docker run --rm --network "$NAME" curlimages/curl:8.10.1 \
              -sS -m 5 -o /dev/null -w '%{http_code} %{content_type}' "http://$NAME-engine:8080$1"
          }
          page=$(docker run --rm --network "$NAME" curlimages/curl:8.10.1 \
            -fsS -m 5 "http://$NAME-engine:8080/")
          grep -q '<title>Orcher Dashboard</title>' <<<"$page" \
            || fail "/ does not serve the dashboard"
          for check in "/workflows/deep-link 200 text/html" \
                       "/api/v1/system/version 200 application/json" \
                       "/api/v1/no-such-route 404 " \
                       "/metrics/no-such-route 404 "; do
            read -r path want_code want_type <<<"$check"
            got=$(get "$path")
            echo "$path: $got"
            case "$got" in
              "$want_code $want_type"*) ;;
              *) fail "$path answered '$got', not $want_code $want_type" ;;
            esac
          done

          # Read the log once: `docker logs | grep -q` under pipefail fails
          # when grep stops reading early, whatever it found.
          logs=$(docker logs "$NAME-engine" 2>&1)
          grep -q 'orcher-entrypoint: migrations applied' <<<"$logs" \
            || fail "the entrypoint did not report applying migrations"
          docker exec "$NAME-engine" orcher-migrate status
          reported=$(docker exec "$NAME-engine" orchestrator --version)
          echo "orchestrator --version: $reported"
          docker exec "$NAME-engine" test -s /LICENSE || fail "/LICENSE is missing"
          docker exec "$NAME-engine" test -s /NOTICE || fail "/NOTICE is missing"
          docker exec "$NAME-engine" test -s /THIRD_PARTY_NOTICES \
            || fail "/THIRD_PARTY_NOTICES is missing or empty"
          for file in LICENSE THIRD_PARTY_NOTICES; do
            docker exec "$NAME-engine" test -s "/usr/share/orcher/ui/$file" \
              || fail "the dashboard's $file is missing"
          done
          docker exec "$NAME-engine" grep -q 'ORCHER dashboard' /NOTICE \
            || fail "/NOTICE does not mention the dashboard"
          grep -q 'endpoints="health,metrics,api/v1,dashboard"' <<<"$logs" \
            || fail "the engine did not report serving the dashboard"
          # Not just present: the notices of crates every build links, and the
          # standard library's.
          notices=$(docker exec "$NAME-engine" cat /THIRD_PARTY_NOTICES)
          for want in '^tokio v' '^sqlx-core v' '^RUST STANDARD LIBRARY$' 'Permission is hereby granted'; do
            grep -q "$want" <<<"$notices" || fail "/THIRD_PARTY_NOTICES has no '$want'"
          done
          head -n 16 <<<"$notices"
          if grep -q 'panicked at' <<<"$logs"; then
            fail "the engine panicked"
          fi

      - name: Remove smoke-test containers
        if: always()
        env:
          LOCAL: ${{ steps.meta.outputs.local }}
          NAME: ${{ steps.meta.outputs.smoke }}
        run: |
          docker rm -f "$NAME-engine" "$NAME-pg" >/dev/null 2>&1 || true
          docker network rm "$NAME" >/dev/null 2>&1 || true
          docker image rm "$LOCAL" >/dev/null 2>&1 || true

      - name: Log in to GHCR
        if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every platform, with provenance and an SBOM attached. On a pull request
      # this packages without pushing: the amd64 and arm64 images both assemble.
      - name: Package all platforms and push
        if: steps.meta.outputs.push == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ steps.meta.outputs.version }}
          CREATED: ${{ steps.meta.outputs.created }}
        run: |
          set -euo pipefail
          args=(-f "$DOCKERFILE" --platform "$PLATFORMS"
            --build-arg VERSION="$VERSION"
            --build-arg REVISION="$(git rev-parse HEAD)"
            --build-arg CREATED="$CREATED")
          IFS=',' read -ra tags <<< "$TAGS"
          for t in "${tags[@]}"; do args+=(--tag "$t"); done
          args+=(--provenance=mode=min --sbom=true --push)
          docker buildx build "${args[@]}" .

      - name: Check the published image
        if: steps.meta.outputs.push == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          raw=$(docker buildx imagetools inspect --raw "$IMAGE:$VERSION")
          for p in amd64 arm64; do
            echo "$raw" | grep -q "\"architecture\": *\"$p\"" \
              || { echo "::error::$IMAGE:$VERSION has no linux/$p image"; exit 1; }
          done
          echo "Published $IMAGE:$VERSION for linux/amd64 and linux/arm64" >> "$GITHUB_STEP_SUMMARY"
