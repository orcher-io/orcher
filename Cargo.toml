[workspace]
members = [
    "crates/common",
    "crates/config",
    "crates/storage",
    "crates/monitoring",
    "crates/dispatch",
    "crates/cluster",
    "crates/core",
    "crates/events",
    "crates/server",
    "services/orchestrator",
]

resolver = "2"

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "Apache-2.0"
authors = ["ORCHER Team <team@netri.run>"]
homepage = "https://github.com/netri-run/orcher"
repository = "https://github.com/netri-run/orcher"
documentation = "https://docs.rs/orcher"
description = "High-performance task orchestration platform built with Rust"
keywords = ["orchestration", "task", "workflow", "scheduler", "async"]
categories = ["asynchronous", "web-programming", "development-tools"]
readme = "README.md"

[workspace.dependencies]
# Core async runtime - tokio first approach
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"
futures-util = "0.3"
async-trait = "0.1"

# Serialization and data handling
serde = { version = "1.0", features = ["derive"] }
# float_roundtrip: parse every f64 back to the same bits. Without it about a
# third of floats come back one unit in the last place off, and a task result
# is parsed twice before its workflow replays it.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
bincode = "1.3"
rmp-serde = "1.1"
base64 = "0.22"

# Time and scheduling
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.8"
jiff = { version = "0.2", features = ["serde"] }
jiff-sqlx = "0.1"
cron = "0.12"
humantime = "2.1"

# Identifiers and utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
rand = "0.8"
hex = "0.4"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# HTTP and web framework
axum = { version = "0.7", features = ["ws", "multipart"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }

# Database and storage
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "macros"] }
redis = { version = "0.32.7", features = ["tokio-comp", "streams", "cluster", "connection-manager"] }

# Connection pooling
deadpool = "0.10"
deadpool-postgres = "0.12"
deadpool-redis = "0.22"

# Security and cryptography
jsonwebtoken = "9.2"
bcrypt = "0.15"
argon2 = "0.5"
ring = "0.17"
rustls = "0.21"
rustls-pemfile = "2.0"
totp-rs = "5.4"
oauth2 = "4.4"
ldap3 = "0.11"
hmac = "0.12"
sha2 = "0.10"
subtle = "2.6"

# Configuration
clap = { version = "4.4", features = ["derive", "env"] }
config = "0.14"
serde_yaml = "0.9"
toml = "0.8"
url = "2.4"
notify = "6.1"
dotenvy = "0.15"

# Logging and monitoring
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus = "0.13"
metrics = "0.24"
metrics-prometheus = "0.8"
tokio-metrics = "0.3"
sysinfo = "0.30"

# Distributed tracing
opentelemetry = "0.21"
opentelemetry_sdk = { version = "0.21", features = ["rt-tokio"] }
opentelemetry-jaeger = { version = "0.18", features = ["rt-tokio"] }
tracing-opentelemetry = "0.21"

# Workflow and dependencies
petgraph = "0.6"
handlebars = "4.0"
regex = "1.0"

# Lock-free data structures
crossbeam-queue = "0.3"
dashmap = "5.5"

# OpenAPI documentation
utoipa = { version = "4.2", features = ["axum_extras", "uuid"] }
utoipa-swagger-ui = { version = "6.0", features = ["axum"] }
utoipa-redoc = { version = "4.0", features = ["axum"] }
utoipa-rapidoc = { version = "4.0", features = ["axum"] }
utoipa-scalar = { version = "0.1", features = ["axum"] }
tower-serve-static = "0.1"
serde_urlencoded = "0.7"

# Additional server dependencies
governor = "0.6"
moka = { version = "0.12", features = ["future"] }
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
tokio-rustls = "0.25"
minijinja = { version = "2.0", features = ["json"] }
ipnet = "2.9"
pin-project-lite = "0.2"
infer = "0.16"
mime = "0.3"
mime_guess = "2.0"
signal-hook = "0.3"
signal-hook-tokio = { version = "0.3", features = ["futures-v0_3"] }
once_cell = "1.19"
parking_lot = "0.12"
bytes = "1.7"

# Compression and streaming
flate2 = "1.0"
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7" }

# Distributed systems
raft = "0.7"

# Health checks and alerting
lettre = "0.11"

# System utilities
num_cpus = "1.16"

# Validation
validator = { version = "0.16", features = ["derive"] }

[workspace.dependencies.orcher-common]
path = "crates/common"

[workspace.dependencies.orcher-config]
path = "crates/config"

[workspace.dependencies.orcher-storage]
path = "crates/storage"



[workspace.dependencies.orcher-monitoring]
path = "crates/monitoring"

[workspace.dependencies.orcher-dispatch]
path = "crates/dispatch"


[workspace.dependencies.orcher-core]
path = "crates/core"

[workspace.dependencies.orcher-events]
path = "crates/events"

# Temporarily commented out - cluster not yet implemented
# [workspace.dependencies.orcher-cluster]
# path = "crates/cluster"

[workspace.dependencies.orcher-server]
path = "crates/server"

# Development dependencies
[workspace.dependencies.criterion]
version = "0.5"
features = ["html_reports"]

[workspace.dependencies.tokio-test]
version = "0.4"

[workspace.dependencies.tempfile]
version = "3.8"

[workspace.dependencies.serial_test]
version = "3.0"

[workspace.dependencies.axum-test]
version = "15"

[workspace.dependencies.mockall]
version = "0.12"

[workspace.dependencies.proptest]
version = "1.4"

[workspace.dependencies.fake]
version = "2.9"
features = ["derive", "uuid"]

[workspace.dependencies.testcontainers]
version = "0.25"

# Workspace metadata
[workspace.metadata]
msrv = "1.70.0"
documentation = "https://docs.rs/orcher"
homepage = "https://github.com/netri-run/orcher"

# ============================================================================
# COMPILATION OPTIMIZATION PROFILES
# ============================================================================

# Fast compilation for development
[profile.dev]
opt-level = 0
debug = true
split-debuginfo = "unpacked"  # Faster on macOS
incremental = true

# Don't optimize or include debug info for dependencies in dev builds
[profile.dev.package."*"]
opt-level = 0
debug = false

# Faster testing
[profile.test]
inherits = "dev"
opt-level = 1  # Slightly optimize test code for faster execution

# Optimized release builds
[profile.release]
opt-level = 3
lto = "thin"  # Thin LTO balances optimization and compile time
codegen-units = 16
incremental = false
debug = false
strip = true  # Strip symbols for smaller binaries
